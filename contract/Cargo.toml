[package]
name = "dark-matter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A public weigh station for NEAR Confidential Intents: reads the treasury straight from intents.near, with no oracle"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.29"

[dev-dependencies]
near-sdk = { version = "~5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

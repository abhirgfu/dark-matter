name: refresh
# Once a day: fetch public data, rebuild, and commit only if every check passes.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and rebuild
        run: python rebuild.py --fresh
      - name: Commit
        run: |
          git config user.name "dark-matter-bot"
          git config user.email "dark-matter-bot@users.noreply.github.com"
          git add -A data site THESIS.md README.md
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
